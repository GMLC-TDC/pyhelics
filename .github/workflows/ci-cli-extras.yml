name: CI - CLI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ensure history is present for automatic versioning
      - uses: actions/setup-node@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -U pip wheel setuptools cffi
      - name: Build NPM
        run: |
          cd helics_cli_extras/client
          npm install
          npm run build
          cp -r build ../helics_cli_extras/static
      - name: Build the web interface first
        run: |
          cd helics_cli_extras
          pip install .
      - name: Download helics library and run pip install
        run: |
          pip install ".[cli,server]"
        env:
          DOWNLOAD_BINARIES: 1
      - name: Run Server
        run: |
          helics server --no-open --port 8000 &
          sleep 5
          curl http://localhost:8000/docs
          kill %+
      - name: Run Observer
        run: |
          mkdir db
          helics observer &
          sleep 5
          kill %+
