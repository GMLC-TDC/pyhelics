name: CI - CLI extras compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  install-shim:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install compatibility package without pyhelics
        run: python -m pip install ./helics_cli_extras
      - name: Import compatibility package
        run: |
          python -W default -c "import helics_cli_extras as e; assert not hasattr(e, 'HelicsObserverFederate')"
          python -c "import importlib.metadata as m; d=m.distribution('helics-cli-extras'); assert not d.requires; assert not any(str(p).endswith(('observer.py', 'database.py')) for p in d.files)"
