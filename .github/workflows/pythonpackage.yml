name: Build Python Packages

on:
  workflow_dispatch:
    inputs:
      use_qemu:
        description: 'Use qemu to build linux, ppc64le & s390x'
        required: false
        default: 'false'
  workflow_run:
    workflows: ["HELICS Version Update"]
    branches: [main]
    types:
      - completed
  release:
    types: published
  pull_request:
    branches:
    - main

env:
  BOOST_ARCHIVE_URL: https://archives.boost.io/release/1.87.0/source/boost_1_87_0.tar.bz2

jobs:
  build-helics:
    # No container needed, since the package is version agnostic
    name: Build ${{ matrix.build }}${{ matrix.arch }} wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: "x86_64"
            build: "manylinux_"
            artifact_suffix: "manylinux_x86_64"
            use_qemu: false
          - os: ubuntu-24.04-arm
            arch: "aarch64"
            build: "manylinux_"
            artifact_suffix: "manylinux_aarch64"
            use_qemu: false
          - os: windows-2022
            arch: "AMD64"
            build: ""
            artifact_suffix: "windows_x86_64"
            use_qemu: false
          - os: windows-2022
            arch: "x86"
            build: ""
            artifact_suffix: "windows_x86"
            use_qemu: false
          - os: macos-26
            arch: "universal2"
            build: ""
            artifact_suffix: "macos"
            use_qemu: false
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # ensure history is present for automatic versioning
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4.4.0
      if: runner.os == 'Linux' && matrix.use_qemu
    - name: Build wheels
      uses: pypa/cibuildwheel@v4.3.2
      env:
        CIBW_ARCHS: "${{ matrix.arch }}"
        CIBW_ARCHS_MACOS: "universal2"
        CIBW_BUILD: "cp311-${{ matrix.build }}*"
        CIBW_BUILD_VERBOSITY: 3
        CIBW_ENVIRONMENT: "CIBW_ARTIFACT_TYPE=${{ matrix.artifact_suffix }}"
        CIBW_BEFORE_ALL_LINUX: >
            mkdir -p /boost &&
            curl -fsSL "${{ env.BOOST_ARCHIVE_URL }}" -o /tmp/pyhelics-boost.tar.bz2 &&
            tar -xjf /tmp/pyhelics-boost.tar.bz2 -C /boost --strip-components=1
        CIBW_ENVIRONMENT_LINUX: "BOOST_ROOT=/boost"
        CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=10.15 CMAKE_ARGS=-DCMAKE_OSX_DEPLOYMENT_TARGET=10.15"
    - uses: actions/upload-artifact@v7
      with:
        name: pyhelics-python-dist-${{matrix.artifact_suffix}}
        path: wheelhouse/*.whl

  build-helics-sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # for setuptools_scm to find tags

    - name: Install Boost
      run: |
        mkdir -p "$RUNNER_TEMP/boost"
        curl -fsSL "$BOOST_ARCHIVE_URL" -o "$RUNNER_TEMP/pyhelics-boost.tar.bz2"
        tar -xjf "$RUNNER_TEMP/pyhelics-boost.tar.bz2" -C "$RUNNER_TEMP/boost" --strip-components=1
    - name: Build sdist
      run: BOOST_ROOT="$RUNNER_TEMP/boost" pipx run build --sdist
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: pyhelics-python-sdist
        path: dist/*.tar.gz


  check_helics-dist:
    name: Check helics dist Python packages
    needs: [build-helics, build-helics-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: pipx run twine check --strict dist/*

  publish-helics:
    needs: [build-helics, build-helics-sdist, check_helics-dist]
    runs-on: ubuntu-latest
    if: github.event.action == 'published' || endsWith(github.ref, 'main')
    environment:
      name: pypi
      url: https://pypi.org/p/helics
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - name: Get the built packages
      uses: actions/download-artifact@v8
      with:
        merge-multiple: true
        path: dist

    - name: Publish package to TestPyPI
      if: endsWith(github.ref, 'main')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.test_pypi_helics_password }}
        repository-url: https://test.pypi.org/legacy/

    - name: Publish package to PyPI
      if: github.event.action == 'published'
      uses: pypa/gh-action-pypi-publish@release/v1
