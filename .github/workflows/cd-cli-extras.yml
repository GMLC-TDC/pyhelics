name: CD - CLI Extras Compatibility

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish compatibility release to PyPI'
        required: true
        type: boolean
        default: false
      publish_to_test_pypi:
        description: 'Publish compatibility release to TestPyPI'
        required: true
        type: boolean
        default: false

jobs:
  build-shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - run: python -m build .
        working-directory: helics_cli_extras
      - uses: actions/upload-artifact@v7
        with:
          name: helics-cli-extras-compatibility-dist
          path: helics_cli_extras/dist/*

  publish-shim:
    if: inputs.publish_to_pypi || inputs.publish_to_test_pypi
    needs: build-shim
    runs-on: ubuntu-latest
    environment:
      name: pypi-cli-extras
      url: https://pypi.org/p/helics-cli-extras
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: helics-cli-extras-compatibility-dist
          path: helics_cli_extras/dist
      - name: Publish to TestPyPI
        if: inputs.publish_to_test_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_PASSWORD }}
          repository-url: https://test.pypi.org/legacy/
          packages-dir: helics_cli_extras/dist
      - name: Publish to PyPI
        if: inputs.publish_to_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: helics_cli_extras/dist
