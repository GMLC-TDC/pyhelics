name: CI - Web UI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ensure history is present for automatic versioning
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -U pip wheel setuptools cffi
      - name: Build and test web UI
        run: |
          cd client
          npm ci --legacy-peer-deps
          npm run build
          mkdir -p ../helics/webserver/static
          cp -r build/. ../helics/webserver/static/
          npx playwright install --with-deps chromium
          npm test -- --reporter=line
      - name: Install pyhelics with server dependencies
        run: |
          pip install ".[cli,server]"
        env:
          DOWNLOAD_BINARIES: 1
      - name: Run Server
        run: |
          helics server --no-open --port 8000 &
          sleep 5
          curl http://localhost:8000/docs
          kill %+
      - name: Run Observer
        run: |
          mkdir db
          helics observer &
          sleep 5
          kill %+
