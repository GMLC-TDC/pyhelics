name: CI - Web UI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ensure history is present for automatic versioning
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -U pip wheel setuptools cffi
      - name: Build web UI
        run: |
          cd client
          npm ci
          npm run build
      - name: Install pyhelics with server dependencies
        run: |
          pip install ".[cli,server]"
        env:
          DOWNLOAD_BINARIES: 1
      - name: Test the installed web UI
        working-directory: client
        run: |
          npx playwright install --with-deps chromium
          npm test -- --reporter=line
      - name: Run Observer
        run: |
          mkdir db
          helics observer &
          sleep 5
          kill %+
