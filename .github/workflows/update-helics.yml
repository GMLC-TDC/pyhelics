name: Update HELICS Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'HELICS version number (without leading `v` prefix)'
        required: true
        type: string
      dryrun:
        description: 'Do a dry run of the update process, without making the commit'
        required: false
        type: boolean

jobs:
  update-helics-version:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set git config for commits
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Update HELICS version number
      env:
        HELICS_RELEASE: ${{ inputs.version }}
      run: |
        [[ "$HELICS_RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        release_url="https://github.com/GMLC-TDC/HELICS/releases/download/v$HELICS_RELEASE"
        curl -fsSL "$release_url/Helics-v$HELICS_RELEASE-SHA-256.txt" -o "$RUNNER_TEMP/helics-sha256.txt"
        hash=$(awk -v file="Helics-v$HELICS_RELEASE-source.tar.gz" '$2 == file {print $1}' "$RUNNER_TEMP/helics-sha256.txt")
        [[ "$hash" =~ ^[0-9a-f]{64}$ ]]
        printf 'set(HELICS_VERSION %s)\nset(HELICS_SOURCE_SHA256 %s)\n' "$HELICS_RELEASE" "$hash" > helics_version.cmake

        git add helics_version.cmake

        echo "::group::git diff --staged"
        git diff --staged
        echo "::endgroup::"

        git commit -m "build(release): Bump to v$HELICS_RELEASE"

        echo "::group::git show"
        git show
        echo "::endgroup::"

        if [ "${{ inputs.dryrun }}" = "false" ]; then
          echo "Pushing changes"
          git push
        fi
